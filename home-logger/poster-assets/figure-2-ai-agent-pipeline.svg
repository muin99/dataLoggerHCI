<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
 <defs><style>.title{font:700 42px Arial,sans-serif;fill:#102A43}.sub{font:400 22px Arial,sans-serif;fill:#486581}.h{font:700 25px Arial,sans-serif;fill:#102A43}.t{font:400 19px Arial,sans-serif;fill:#243B53}.s{font:400 16px Arial,sans-serif;fill:#486581}.w{font:700 20px Arial,sans-serif;fill:#fff}.step{font:700 18px Arial,sans-serif;fill:#fff}.line{stroke:#4C8C7A;stroke-width:4;fill:none}.blue{stroke:#3269B0;stroke-width:4;fill:none}.orange{stroke:#C47A00;stroke-width:4;fill:none}.dash{stroke:#7B61A8;stroke-width:3;stroke-dasharray:9 8;fill:none}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#4C8C7A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#3269B0"/></marker><marker id="o" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#C47A00"/></marker></defs>
 <rect width="1600" height="1150" fill="#F9FCFC"/><text x="70" y="68" class="title">Inside the Home Logger AI Agent: Perception → Reasoning → Validation → Human-Controlled Action</text><text x="70" y="104" class="sub">The AI does not directly commit household records. It proposes structured, explainable outcomes that pass safety checks and user review.</text>
 <rect x="70" y="160" width="1460" height="710" rx="28" fill="#fff" stroke="#C8DEDA" stroke-width="2"/>
 <!-- stages -->
 <circle cx="145" cy="235" r="30" fill="#0B7A5A"/><text x="139" y="242" class="step">1</text><text x="195" y="229" class="h">Input guard</text><text x="195" y="257" class="t">Accept image only if format, size, and upload are valid.</text>
 <circle cx="145" cy="365" r="30" fill="#0B7A5A"/><text x="139" y="372" class="step">2</text><text x="195" y="359" class="h">Context retrieval</text><text x="195" y="387" class="t">Load user-defined object categories, prices, and verified image examples.</text>
 <circle cx="145" cy="495" r="30" fill="#0B7A5A"/><text x="139" y="502" class="step">3</text><text x="195" y="489" class="h">Vision reasoning</text><text x="195" y="517" class="t">Vision model decides: known object, receipt, or uncertain/unknown.</text>
 <circle cx="145" cy="625" r="30" fill="#0B7A5A"/><text x="139" y="632" class="step">4</text><text x="195" y="619" class="h">Structured extraction</text><text x="195" y="647" class="t">For receipts: merchant, items, quantities, prices, subtotal, discount, tax, total.</text>
 <circle cx="145" cy="755" r="30" fill="#0B7A5A"/><text x="139" y="762" class="step">5</text><text x="195" y="749" class="h">Policy + validation</text><text x="195" y="777" class="t">Apply price rules, reconciliation, pending state, deadline, and escalation policy.</text>
 <!-- central processing -->
 <rect x="760" y="195" width="305" height="105" rx="18" fill="#E9F7F1" stroke="#8AC7B5" stroke-width="2"/><text x="790" y="235" class="h">Image normalisation</text><text x="790" y="263" class="t">JPEG storage + safe path</text>
 <rect x="760" y="325" width="305" height="105" rx="18" fill="#E9F7F1" stroke="#8AC7B5" stroke-width="2"/><text x="790" y="365" class="h">Few-shot knowledge</text><text x="790" y="393" class="t">Categories + prior corrections</text>
 <rect x="760" y="455" width="305" height="105" rx="18" fill="#FFF5DD" stroke="#E3B65D" stroke-width="2"/><text x="790" y="495" class="h">Hugging Face vision LLM</text><text x="790" y="523" class="t">Constrained classification prompt</text>
 <rect x="760" y="585" width="305" height="105" rx="18" fill="#FFF5DD" stroke="#E3B65D" stroke-width="2"/><text x="790" y="625" class="h">Receipt JSON parser</text><text x="790" y="653" class="t">Extract typed fields and items</text>
 <rect x="760" y="715" width="305" height="105" rx="18" fill="#ECF3FF" stroke="#B9CDEC" stroke-width="2"/><text x="790" y="755" class="h">Rule engine</text><text x="790" y="783" class="t">Math checks + state transitions</text>
 <path d="M650 235H750M650 365H750M650 495H750M650 625H750M650 755H750" class="line" marker-end="url(#a)"/>
 <!-- decisions / results -->
 <path d="M1065 507H1130" class="orange" marker-end="url(#o)"/>
 <polygon points="1210,445 1290,507 1210,569 1130,507" fill="#FFF5DD" stroke="#C47A00" stroke-width="3"/><text x="1160" y="501" class="h">What is</text><text x="1160" y="529" class="h">it?</text>
 <path d="M1290 507H1400V330" class="blue" marker-end="url(#b)"/><path d="M1290 507H1400V510" class="blue" marker-end="url(#b)"/><path d="M1290 507H1400V690" class="blue" marker-end="url(#b)"/>
 <text x="1310" y="352" class="s">known object</text><text x="1310" y="492" class="s">receipt</text><text x="1310" y="672" class="s">uncertain</text>
 <rect x="1400" y="265" width="105" height="130" rx="16" fill="#DFF3EC"/><text x="1418" y="305" class="h">Object</text><text x="1418" y="332" class="h">proposal</text><text x="1418" y="361" class="s">Qty = 1</text><text x="1418" y="383" class="s">Price from</text><text x="1418" y="405" class="s">category</text>
 <rect x="1400" y="445" width="105" height="130" rx="16" fill="#E6F0FF"/><text x="1418" y="485" class="h">Receipt</text><text x="1418" y="512" class="h">proposal</text><text x="1418" y="541" class="s">Typed fields</text><text x="1418" y="563" class="s">+ line items</text>
 <rect x="1400" y="625" width="105" height="130" rx="16" fill="#F8E8E8"/><text x="1418" y="665" class="h">Unknown</text><text x="1418" y="692" class="h">queue</text><text x="1418" y="721" class="s">No false</text><text x="1418" y="743" class="s">assumption</text>
 <!-- policy -->
 <rect x="70" y="905" width="450" height="170" rx="22" fill="#E6F0FF" stroke="#B9CDEC" stroke-width="2"/><text x="100" y="948" class="h">Risk-sensitive commit policy</text><text x="100" y="981" class="t">Attendance: silence may confirm after 10 seconds.</text><text x="100" y="1012" class="t">Objects: pending review then auto-confirm.</text><text x="100" y="1043" class="t">Receipts: silence always rejects, never commits.</text>
 <rect x="570" y="905" width="450" height="170" rx="22" fill="#FFF5DD" stroke="#E3B65D" stroke-width="2"/><text x="600" y="948" class="h">Validation before action</text><text x="600" y="981" class="t">Receipt total ≈ subtotal − discount + tax.</text><text x="600" y="1012" class="t">AI failure or ambiguity becomes “unknown”.</text><text x="600" y="1043" class="t">Raw AI output is retained for auditing.</text>
 <rect x="1070" y="905" width="460" height="170" rx="22" fill="#F1EDF9" stroke="#C9B8E8" stroke-width="2"/><text x="1100" y="948" class="h">Learning, with human authority</text><text x="1100" y="981" class="t">Approved/corrected object images become examples.</text><text x="1100" y="1012" class="t">Examples strengthen later category matching.</text><text x="1100" y="1043" class="t">Human review remains the final authority.</text>
 <path d="M1450 755C1450 845 1280 850 1260 900" class="dash" marker-end="url(#b)"/>
</svg>
