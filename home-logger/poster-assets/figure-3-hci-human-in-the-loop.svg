<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
 <defs><style>.title{font:700 42px Arial,sans-serif;fill:#102A43}.sub{font:400 22px Arial,sans-serif;fill:#486581}.h{font:700 25px Arial,sans-serif;fill:#102A43}.t{font:400 19px Arial,sans-serif;fill:#243B53}.s{font:400 16px Arial,sans-serif;fill:#486581}.w{font:700 20px Arial,sans-serif;fill:#fff}.line{stroke:#0B7A5A;stroke-width:5;fill:none}.dash{stroke:#7B61A8;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0B7A5A"/></marker><marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7B61A8"/></marker></defs>
 <rect width="1600" height="1050" fill="#F9FCFC"/><text x="70" y="70" class="title">Human-in-the-Loop Interaction Model: From Intention to Trustworthy Household Record</text><text x="70" y="106" class="sub">Home Logger closes the gulfs of execution and evaluation by making every system state visible, reversible, and reviewable.</text>
 <!-- cycle -->
 <circle cx="800" cy="500" r="285" fill="#F1FAF7" stroke="#B8D8CF" stroke-width="3"/><circle cx="800" cy="500" r="120" fill="#0B7A5A"/><text x="730" y="485" class="w">TRUSTWORTHY</text><text x="748" y="516" class="w">HOME LOG</text>
 <rect x="685" y="245" width="230" height="100" rx="18" fill="#E6F0FF" stroke="#B9CDEC" stroke-width="2"/><text x="725" y="285" class="h">1. User goal</text><text x="711" y="314" class="t">“Log this event”</text>
 <rect x="1010" y="410" width="260" height="105" rx="18" fill="#E9F7F1" stroke="#8AC7B5" stroke-width="2"/><text x="1040" y="450" class="h">2. Physical action</text><text x="1040" y="479" class="t">RFID / B1–B5 / camera</text>
 <rect x="900" y="675" width="285" height="110" rx="18" fill="#FFF5DD" stroke="#E3B65D" stroke-width="2"/><text x="930" y="716" class="h">3. System interpretation</text><text x="930" y="745" class="t">AI proposal + policy checks</text>
 <rect x="415" y="675" width="285" height="110" rx="18" fill="#F1EDF9" stroke="#C9B8E8" stroke-width="2"/><text x="446" y="716" class="h">4. Feedback &amp; choice</text><text x="446" y="745" class="t">LCD, LED, buzzer, timer</text>
 <rect x="330" y="410" width="260" height="105" rx="18" fill="#F8E8E8" stroke="#E5B8B8" stroke-width="2"/><text x="360" y="450" class="h">5. User evaluation</text><text x="360" y="479" class="t">Confirm, cancel, or review</text>
 <path d="M915 345C1050 350 1080 385 1080 400M1270 515C1280 625 1190 680 1170 690M900 785C760 870 650 810 680 785M415 675C300 630 300 535 330 515M590 410C610 350 655 340 685 340" class="line" marker-end="url(#a)"/>
 <!-- HCI side panels -->
 <rect x="70" y="180" width="255" height="205" rx="22" fill="#fff" stroke="#C8DEDA" stroke-width="2"/><text x="98" y="223" class="h">Gulf of execution</text><text x="98" y="258" class="t">Reduced by physical,</text><text x="98" y="285" class="t">single-purpose controls:</text><text x="98" y="316" class="s">• Tap card</text><text x="98" y="341" class="s">• Press labelled button</text><text x="98" y="366" class="s">• Point phone camera</text>
 <rect x="1275" y="180" width="255" height="205" rx="22" fill="#fff" stroke="#C8DEDA" stroke-width="2"/><text x="1303" y="223" class="h">Gulf of evaluation</text><text x="1303" y="258" class="t">Reduced by immediate,</text><text x="1303" y="285" class="t">multimodal feedback:</text><text x="1303" y="316" class="s">• LCD status + countdown</text><text x="1303" y="341" class="s">• LED state colour</text><text x="1303" y="366" class="s">• Buzzer acknowledgement</text>
 <rect x="70" y="620" width="270" height="225" rx="22" fill="#fff" stroke="#C8DEDA" stroke-width="2"/><text x="98" y="663" class="h">Error prevention</text><text x="98" y="697" class="t">• 10-second RFID cancel</text><text x="98" y="727" class="t">• Debounced repeated taps</text><text x="98" y="757" class="t">• Receipt total validation</text><text x="98" y="787" class="t">• Unknown ≠ assumed match</text><text x="98" y="817" class="t">• Risk-sensitive timeouts</text>
 <rect x="1260" y="620" width="270" height="225" rx="22" fill="#fff" stroke="#C8DEDA" stroke-width="2"/><text x="1288" y="663" class="h">Recovery &amp; control</text><text x="1288" y="697" class="t">B3: cancel incorrect action</text><text x="1288" y="727" class="t">B4: confirm known result</text><text x="1288" y="757" class="t">B5: defer to dashboard</text><text x="1288" y="787" class="t">Dashboard: edit / resolve</text><text x="1288" y="817" class="t">Auditable stored history</text>
 <!-- learning feedback -->
 <path d="M1300 880 C1070 990,530 990,300 860" class="dash" marker-end="url(#p)"/><rect x="525" y="890" width="550" height="100" rx="18" fill="#F1EDF9" stroke="#C9B8E8" stroke-width="2"/><text x="560" y="930" class="h">Long-term feedback loop</text><text x="560" y="960" class="t">Dashboard corrections resolve uncertainty and supply verified examples for better future object recognition.</text>
</svg>
