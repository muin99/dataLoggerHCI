<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#102A43}.sub{font:400 22px Arial,sans-serif;fill:#486581}.h{font:700 25px Arial,sans-serif;fill:#102A43}.t{font:400 19px Arial,sans-serif;fill:#243B53}.small{font:400 16px Arial,sans-serif;fill:#486581}.white{font:700 22px Arial,sans-serif;fill:#fff}.tag{font:700 16px Arial,sans-serif;fill:#0B5D45}.box{stroke:#B8D8CF;stroke-width:2}.line{stroke:#4C8C7A;stroke-width:4;fill:none}.dash{stroke:#6B86A3;stroke-width:3;stroke-dasharray:10 8;fill:none}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4C8C7A"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6B86A3"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#F7FBFA"/>
  <text x="70" y="72" class="title">Home Logger: End-to-End Intelligent Household Logging Ecosystem</text>
  <text x="70" y="108" class="sub">A tangible HCI interface connects everyday household activity to an AI agent, auditable data storage, and human review.</text>

  <rect x="80" y="180" width="305" height="660" rx="26" fill="#E9F7F1" class="box"/>
  <text x="112" y="225" class="h">1. Physical Interaction Layer</text>
  <rect x="112" y="255" width="240" height="95" rx="16" fill="#fff" class="box"/><text x="137" y="294" class="h">RFID attendance</text><text x="137" y="323" class="t">Worker taps registered card</text>
  <rect x="112" y="377" width="240" height="125" rx="16" fill="#fff" class="box"/><text x="137" y="416" class="h">Touch controls</text><text x="137" y="447" class="t">B1 Camera • B2 Capture</text><text x="137" y="474" class="t">B3 Cancel • B4 Confirm • B5 Review</text>
  <rect x="112" y="529" width="240" height="115" rx="16" fill="#fff" class="box"/><text x="137" y="568" class="h">Phone camera relay</text><text x="137" y="597" class="t">Frames item or receipt</text><text x="137" y="624" class="t">without a separate app</text>
  <rect x="112" y="671" width="240" height="125" rx="16" fill="#0B7A5A"/><text x="137" y="713" class="white">Multimodal feedback</text><text x="137" y="744" class="white">LCD instructions • LEDs</text><text x="137" y="772" class="white">Buzzer • Countdown</text>

  <rect x="485" y="180" width="350" height="660" rx="26" fill="#ECF3FF" stroke="#B9CDEC" stroke-width="2"/>
  <text x="520" y="225" class="h">2. ESP32 Interaction Controller</text>
  <rect x="520" y="258" width="280" height="85" rx="16" fill="#fff" stroke="#B9CDEC" stroke-width="2"/><text x="545" y="294" class="h">State machine</text><text x="545" y="321" class="t">Idle → Scan → Review → Result</text>
  <rect x="520" y="373" width="280" height="110" rx="16" fill="#fff" stroke="#B9CDEC" stroke-width="2"/><text x="545" y="409" class="h">Local safety decisions</text><text x="545" y="438" class="t">Debounce buttons and RFID taps</text><text x="545" y="465" class="t">Drive timers and feedback</text>
  <rect x="520" y="515" width="280" height="110" rx="16" fill="#fff" stroke="#B9CDEC" stroke-width="2"/><text x="545" y="551" class="h">Wi-Fi API client</text><text x="545" y="580" class="t">Sends RFID UID and images</text><text x="545" y="607" class="t">Receives actionable results</text>
  <rect x="520" y="657" width="280" height="138" rx="16" fill="#3269B0"/><text x="545" y="697" class="white">Device-level review</text><text x="545" y="728" class="white">Attendance: 10-second cancel</text><text x="545" y="756" class="white">Object: confirm / review</text><text x="545" y="784" class="white">Receipt: never auto-confirm</text>

  <rect x="935" y="180" width="350" height="660" rx="26" fill="#FFF7E8" stroke="#EFCB82" stroke-width="2"/>
  <text x="970" y="225" class="h">3. Server-Side AI Agent</text>
  <rect x="970" y="258" width="280" height="78" rx="16" fill="#fff" stroke="#EFCB82" stroke-width="2"/><text x="995" y="292" class="h">Perceive</text><text x="995" y="319" class="t">Validate image and retain it safely</text>
  <rect x="970" y="363" width="280" height="88" rx="16" fill="#fff" stroke="#EFCB82" stroke-width="2"/><text x="995" y="397" class="h">Reason</text><text x="995" y="424" class="t">Vision AI: object, receipt, unknown</text>
  <rect x="970" y="478" width="280" height="88" rx="16" fill="#fff" stroke="#EFCB82" stroke-width="2"/><text x="995" y="512" class="h">Act</text><text x="995" y="539" class="t">Create pending, reviewable record</text>
  <rect x="970" y="593" width="280" height="92" rx="16" fill="#fff" stroke="#EFCB82" stroke-width="2"/><text x="995" y="627" class="h">Verify</text><text x="995" y="654" class="t">Reconcile receipt mathematics</text>
  <rect x="970" y="712" width="280" height="83" rx="16" fill="#A66400"/><text x="995" y="748" class="white">Escalate uncertainty</text><text x="995" y="776" class="white">Unknowns go to human review</text>

  <rect x="1375" y="180" width="155" height="660" rx="26" fill="#F1EDF9" stroke="#C9B8E8" stroke-width="2"/>
  <text x="1402" y="225" class="h">4.</text><text x="1402" y="255" class="h">Memory</text>
  <rect x="1400" y="286" width="105" height="100" rx="14" fill="#fff" stroke="#C9B8E8" stroke-width="2"/><text x="1419" y="326" class="h">MySQL</text><text x="1415" y="354" class="small">records</text>
  <rect x="1400" y="417" width="105" height="115" rx="14" fill="#fff" stroke="#C9B8E8" stroke-width="2"/><text x="1415" y="455" class="h">Image</text><text x="1415" y="482" class="small">storage</text><text x="1415" y="508" class="small">audit trail</text>
  <rect x="1400" y="562" width="105" height="150" rx="14" fill="#fff" stroke="#C9B8E8" stroke-width="2"/><text x="1415" y="600" class="h">Learning</text><text x="1415" y="627" class="small">verified</text><text x="1415" y="651" class="small">examples</text><text x="1415" y="675" class="small">for matching</text>

  <path d="M385 510 H475" class="line" marker-end="url(#arrow)"/><text x="392" y="490" class="tag">input + intent</text>
  <path d="M835 510 H925" class="line" marker-end="url(#arrow)"/><text x="845" y="490" class="tag">secure HTTP</text>
  <path d="M1285 510 H1365" class="line" marker-end="url(#arrow)"/><text x="1292" y="490" class="tag">persist</text>
  <path d="M1450 840 C1450 925,1100 925,1100 840" class="dash" marker-end="url(#arrowBlue)"/><text x="1120" y="944" class="small">Confirmed corrections become reference examples: the system improves its future object matches without silently changing financial facts.</text>
  <rect x="80" y="875" width="850" height="65" rx="14" fill="#DFF3EC"/><text x="110" y="916" class="h">Design principle: fast physical action now; detailed, recoverable review in the dashboard later.</text>
</svg>
